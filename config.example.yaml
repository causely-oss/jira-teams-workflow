jira:
  # rovo = every Jira call goes through the Atlassian Rovo MCP server (called from code), so one
  #        Atlassian MCP V2 token covers tickets and the duplicate check. Needs an org admin to
  #        allow API tokens for the Rovo MCP server; the service won't start without access.
  # rest = Jira Cloud REST v3 with a classic Jira API token. No duplicate check: Rovo rejects
  #        that token, so set rovo.dedup_check: false.
  backend: rovo

  # Where the bot may write. There is no implicit default: the service refuses to start
  # unless `default` and every route project are in `allowed` and not in `blocked`.
  # Pick per deployment here, per route below, or per webhook with ?project=KEY
  # (the override must also be in `allowed`).
  projects:
    default: CHANGE_ME          # e.g. a dedicated incident / reliability project (OPS)
    allowed: [CHANGE_ME]
    blocked: []                 # never write here, even if listed above, e.g. [SEC, HR]
  # Must exist in every allowed project, with no required fields beyond summary.
  # Check: GET /rest/api/3/issue/createmeta/<KEY>/issuetypes
  issue_type: Task
  # Tickets are only auto-created at or above this Causely severity.
  # Lower-severity Issues still post to Teams. Keeps autonomous mode from flooding Jira.
  min_ticket_severity: Medium
  priority_map:                 # Causely severity -> Jira priority name
    Critical: Highest
    High: High
    Medium: Medium
    Low: Low
  extra_labels: [causely, auto-triage]
  # Min seconds between evidence comments on one ticket. Severity escalation and
  # resolution bypass it. Causely Issues can rotate primary diagnosis many times a day.
  evidence_cooldown_seconds: 1800

  # First match wins. Keys are matched against the Causely Issue's affected entity.
  # namespace / cluster / entity_name support glob patterns. Projects must be allowed.
  routes: []
    # - match: { cluster: "prod-us-east" }
    #   project: DEMO
    # - match: { namespace: "payments*" }
    #   project: PAY
    # - match: { team_label: "platform-team" }   # causely.ai/team label, when present
    #   project: PLAT

alerts:
  # Ignore repeat deliveries of the same alert fingerprint inside this window.
  dedup_window_seconds: 600

rovo:
  # Before opening a ticket, a read-only agent searches Jira via Rovo for an open ticket a
  # person already filed for the same problem. High-confidence match -> attach to it
  # (label + evidence comment) instead of creating. Medium -> create, flag possible duplicate.
  # Needs Rovo MCP access (see backend above). Without it, the check is turned off at startup
  # with a warning. Run `python -m app.cli doctor`.
  dedup_check: true
  lookback_days: 14            # Rovo searches only jira.projects.allowed
  # One Rovo Search per new ticket, which also covers Confluence, so past postmortems and
  # runbooks show up as related items. Costs up to 10 Rovo credits per call. Needs the
  # search:rovo:agent-interface scope on JIRA_API_TOKEN.
  use_rovo_search: true
